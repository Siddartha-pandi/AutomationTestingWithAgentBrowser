<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <filter id="pGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <marker id="pipeArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#090d16"/>

  <!-- Header -->
  <rect x="40" y="25" width="1120" height="60" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#pGlow)"/>
  <text x="70" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Asynchronous Execution Pipeline &amp; Observability Architecture</text>
  <rect x="910" y="40" width="230" height="30" rx="15" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1"/>
  <text x="925" y="60" font-family="sans-serif" font-size="11" font-weight="700" fill="#bae6fd">CELERY 5.7 • REDIS 7</text>

  <!-- Step 1: Dispatch Sources -->
  <g transform="translate(40, 110)" filter="url(#pGlow)">
    <rect width="250" height="280" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
    <rect width="250" height="30" rx="8" fill="#1d4ed8"/>
    <rect y="22" width="250" height="8" fill="#1d4ed8"/>
    <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#eff6ff">1. DISPATCH INGESTION</text>

    <g transform="translate(15, 45)" font-family="sans-serif" font-size="11">
      <rect width="220" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="18" font-weight="700" fill="#f8fafc">Manual UI Trigger</text>
      <text x="10" y="32" font-size="10" fill="#94a3b8">User clicks "Run Flow" on builder</text>

      <rect y="52" width="220" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="70" font-weight="700" fill="#f8fafc">Scheduled (Celery Beat)</text>
      <text x="10" y="84" font-size="10" fill="#94a3b8">Cron timer (e.g. 0 2 * * * Kolkata)</text>

      <rect y="104" width="220" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="122" font-weight="700" fill="#f8fafc">CI/CD Webhook / API</text>
      <text x="10" y="136" font-size="10" fill="#94a3b8">POST /api/v1/executions/run</text>

      <rect y="156" width="220" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="174" font-weight="700" fill="#f8fafc">Regression Test Suite</text>
      <text x="10" y="188" font-size="10" fill="#94a3b8">Batch runner executing N test cases</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="290" y1="240" x2="340" y2="240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#pipeArrow)"/>

  <!-- Step 2: Redis Broker & Celery Worker -->
  <g transform="translate(345, 110)" filter="url(#pGlow)">
    <rect width="260" height="280" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
    <rect width="260" height="30" rx="8" fill="#be123c"/>
    <rect y="22" width="260" height="8" fill="#be123c"/>
    <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffe4e6">2. ASYNC TASK QUEUE</text>

    <g transform="translate(15, 45)" font-family="sans-serif" font-size="11">
      <rect width="230" height="50" rx="4" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
      <text x="10" y="20" font-weight="700" fill="#fda4af">Redis 7 Message Broker</text>
      <text x="10" y="38" font-family="monospace" font-size="10" fill="#94a3b8">queue: celery_executions</text>

      <rect y="60" width="230" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="80" font-weight="700" fill="#f8fafc">Celery Worker Daemon</text>
      <text x="10" y="96" font-size="10" fill="#94a3b8">• Concurrency: 4 workers</text>
      <text x="10" y="110" font-size="10" fill="#94a3b8">• Prefetch multiplier: 1</text>

      <rect y="130" width="230" height="85" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="150" font-weight="700" fill="#f8fafc">Secret Decryptor Bridge</text>
      <text x="10" y="166" font-size="10" fill="#34d399">• AES-256-GCM in memory</text>
      <text x="10" y="180" font-size="10" fill="#34d399">• Never passed in shell argv</text>
      <text x="10" y="196" font-size="10" fill="#34d399">• Redaction filters armed</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="605" y1="240" x2="655" y2="240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#pipeArrow)"/>

  <!-- Step 3: Agent Browser CLI Subprocess -->
  <g transform="translate(660, 110)" filter="url(#pGlow)">
    <rect width="250" height="280" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect width="250" height="30" rx="8" fill="#047857"/>
    <rect y="22" width="250" height="8" fill="#047857"/>
    <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#d1fae5">3. AGENT BROWSER SUBPROCESS</text>

    <g transform="translate(15, 45)" font-family="sans-serif" font-size="11">
      <rect width="220" height="45" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="18" font-weight="700" fill="#6ee7b7">Session Isolation</text>
      <text x="10" y="34" font-family="monospace" font-size="9" fill="#a7f3d0">--session &lt;exec_uuid&gt;</text>

      <rect y="55" width="220" height="50" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="74" font-weight="700" fill="#f8fafc">Headless Chromium CLI</text>
      <text x="10" y="90" font-size="10" fill="#94a3b8">Native: open, click, fill, is, get</text>

      <rect y="115" width="220" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="134" font-weight="700" fill="#f8fafc">Network Whitelisting</text>
      <text x="10" y="149" font-family="monospace" font-size="9" fill="#38bdf8">AGENT_BROWSER_ALLOWED_DOMAINS</text>

      <rect y="170" width="220" height="45" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="189" font-weight="700" fill="#f8fafc">Execution Timeouts</text>
      <text x="10" y="204" font-size="10" fill="#94a3b8">Hard limit 300s guard kill</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="910" y1="240" x2="960" y2="240" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#pipeArrow)"/>

  <!-- Step 4: Observability Stream & Artifacts -->
  <g transform="translate(965, 110)" filter="url(#pGlow)">
    <rect width="195" height="280" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <rect width="195" height="30" rx="8" fill="#6b21a8"/>
    <rect y="22" width="195" height="8" fill="#6b21a8"/>
    <text x="15" y="20" font-family="sans-serif" font-size="11" font-weight="800" fill="#f3e8ff">4. REAL-TIME EMISSION</text>

    <g transform="translate(15, 45)" font-family="sans-serif" font-size="11">
      <rect width="165" height="45" rx="4" fill="#0f172a"/>
      <text x="10" y="18" font-weight="700" fill="#d8b4fe">Streaming Logs</text>
      <text x="10" y="34" font-size="10" fill="#94a3b8">Redacted in real time</text>

      <rect y="55" width="165" height="45" rx="4" fill="#0f172a"/>
      <text x="10" y="74" font-weight="700" fill="#d8b4fe">Screenshots</text>
      <text x="10" y="90" font-size="10" fill="#94a3b8">Step PNG snapshots</text>

      <rect y="115" width="165" height="45" rx="4" fill="#0f172a"/>
      <text x="10" y="134" font-weight="700" fill="#d8b4fe">HAR Network Log</text>
      <text x="10" y="150" font-size="10" fill="#94a3b8">All HTTP requests</text>

      <rect y="170" width="165" height="45" rx="4" fill="#0f172a"/>
      <text x="10" y="189" font-weight="700" fill="#d8b4fe">DOM Snapshots</text>
      <text x="10" y="204" font-size="10" fill="#94a3b8">JSON trees for audits</text>
    </g>
  </g>

  <!-- Bottom: Persistence, Verification & Tamper Detection -->
  <g transform="translate(40, 420)" filter="url(#pGlow)">
    <rect width="1120" height="300" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="1120" height="34" rx="10" fill="#1e293b"/>
    <rect y="24" width="1120" height="10" fill="#1e293b"/>
    <text x="20" y="23" font-family="sans-serif" font-size="13" font-weight="800" fill="#f8fafc">PERSISTENCE, CRYPTOGRAPHIC TAMPER DETECTION &amp; ARTIFACT INTEGRITY</text>

    <!-- Sub Card 1: PostgreSQL Tables -->
    <g transform="translate(20, 50)">
      <rect width="340" height="230" rx="6" fill="#1e293b" stroke="#2dd4bf" stroke-width="1"/>
      <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#99f6e4">PostgreSQL 16 Storage (19 Tables)</text>
      
      <text x="15" y="55" font-family="monospace" font-size="11" fill="#cbd5e1">• executions (id, status, duration)</text>
      <text x="15" y="80" font-family="monospace" font-size="11" fill="#cbd5e1">• execution_steps (step_id, status)</text>
      <text x="15" y="105" font-family="monospace" font-size="11" fill="#cbd5e1">• execution_logs (level, redacted_msg)</text>
      <text x="15" y="130" font-family="monospace" font-size="11" fill="#cbd5e1">• dom_snapshots (snapshot_json)</text>
      <text x="15" y="155" font-family="monospace" font-size="11" fill="#cbd5e1">• healing_events (before, after, score)</text>
      <text x="15" y="180" font-family="monospace" font-size="11" fill="#cbd5e1">• audit_logs (actor, action, timestamp)</text>
      <text x="15" y="205" font-family="sans-serif" font-size="10" fill="#34d399">✔ Fully indexed UUID foreign keys</text>
    </g>

    <!-- Sub Card 2: SHA-256 Tamper Detection -->
    <g transform="translate(380, 50)">
      <rect width="355" height="230" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#fde68a">Cryptographic Tamper-Proof Verification</text>
      
      <text x="15" y="55" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. Every artifact file is hashed with SHA-256:</text>
      <rect x="15" y="65" width="325" height="26" rx="4" fill="#0f172a"/>
      <text x="25" y="82" font-family="monospace" font-size="9" fill="#fbbf24">sha256 = 8f9b4e1a6c...58d2e4a</text>

      <text x="15" y="115" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. Digest recorded in immutable PostgreSQL record.</text>
      <text x="15" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">3. Automated On-Access Integrity Check:</text>
      <text x="25" y="160" font-family="sans-serif" font-size="10" fill="#94a3b8">• Before download or report view, hash is recomputed.</text>
      <text x="25" y="175" font-family="sans-serif" font-size="10" fill="#94a3b8">• Any disk modification triggers 403 TAMPER_DETECTED.</text>
      
      <rect x="15" y="190" width="325" height="26" rx="4" fill="#064e3b"/>
      <text x="25" y="207" font-family="sans-serif" font-size="10" font-weight="700" fill="#a7f3d0">✔ Verified Integrity: Uncompromised Audit Trail</text>
    </g>

    <!-- Sub Card 3: Reports & Artifact Bundles -->
    <g transform="translate(755, 50)">
      <rect width="345" height="230" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">Compliance &amp; Export Formats</text>
      
      <text x="15" y="55" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Standalone Executive HTML Report</text>
      <text x="25" y="72" font-family="sans-serif" font-size="10" fill="#94a3b8">Embeds metrics, step timeline, base64 images</text>

      <text x="15" y="95" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Formal PDF Audit Certificate</text>
      <text x="25" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8">Cryptographically signed compliance record</text>

      <text x="15" y="135" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Complete HAR Network Archive</text>
      <text x="25" y="152" font-family="sans-serif" font-size="10" fill="#94a3b8">Load in Chrome DevTools / Postman</text>

      <text x="15" y="175" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Step Screenshots ZIP Bundle</text>
      <text x="25" y="192" font-family="sans-serif" font-size="10" fill="#94a3b8">Chronological PNG visual walkthrough</text>
    </g>
  </g>
</svg>
