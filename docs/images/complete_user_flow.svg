<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="emeraldArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#bg2)"/>

  <!-- Title Header -->
  <rect x="50" y="25" width="1100" height="70" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardGlow)"/>
  <text x="80" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">End-to-End Enterprise Automation &amp; Testing Lifecycle</text>
  <text x="80" y="80" font-family="sans-serif" font-size="12" fill="#94a3b8">Complete workflow from authentication through DOM extraction, DAG authoring, deterministic healing, and compliance reporting</text>
  <rect x="910" y="45" width="220" height="30" rx="15" fill="#047857" stroke="#10b981" stroke-width="1"/>
  <text x="925" y="65" font-family="sans-serif" font-size="12" font-weight="700" fill="#d1fae5">Deterministic Flow Engine</text>

  <!-- STEP 1: Authentication & Project Setup -->
  <g filter="url(#cardGlow)">
    <rect x="50" y="125" width="330" height="180" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="85" cy="155" r="16" fill="#1e3a8a"/>
    <text x="80" y="161" font-family="sans-serif" font-size="14" font-weight="700" fill="#93c5fd">1</text>
    <text x="115" y="160" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Authentication &amp; RBAC</text>
    
    <text x="70" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">• User logs in (JWT Bearer Token issued)</text>
    <text x="70" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">• Role assignment: Owner, Admin, QA, Dev</text>
    <text x="70" y="235" font-family="sans-serif" font-size="12" fill="#94a3b8">• Project context &amp; Workspace selection</text>
    <text x="70" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">• Secrets encrypted via AES-256-GCM</text>
    <text x="70" y="275" font-family="sans-serif" font-size="12" fill="#94a3b8">• Environments defined (Dev, Staging, Prod)</text>

    <rect x="70" y="285" width="110" height="15" rx="3" fill="#1e293b"/>
    <text x="75" y="296" font-family="monospace" font-size="9" fill="#38bdf8">POST /api/v1/auth/login</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="380" y1="215" x2="430" y2="215" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- STEP 2: Live DOM Inspection & Profiling -->
  <g filter="url(#cardGlow)">
    <rect x="435" y="125" width="330" height="180" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="470" cy="155" r="16" fill="#581c87"/>
    <text x="465" y="161" font-family="sans-serif" font-size="14" font-weight="700" fill="#e9d5ff">2</text>
    <text x="500" y="160" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">DOM Intelligence &amp; Profiler</text>

    <text x="455" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">• Live Browser session spawned (--session)</text>
    <text x="455" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">• Accessibility tree snapshot (-i --json)</text>
    <text x="455" y="235" font-family="sans-serif" font-size="12" fill="#94a3b8">• Interactive elements tagged (@e1, @e2...)</text>
    <text x="455" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">• Multi-attribute profile fingerprints stored</text>
    <text x="455" y="275" font-family="sans-serif" font-size="12" fill="#94a3b8">• Stability score calculated for selectors</text>

    <rect x="455" y="285" width="130" height="15" rx="3" fill="#1e293b"/>
    <text x="460" y="296" font-family="monospace" font-size="9" fill="#c084fc">POST /api/v1/dom/extract</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="765" y1="215" x2="815" y2="215" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- STEP 3: Visual Flow & Test Authoring -->
  <g filter="url(#cardGlow)">
    <rect x="820" y="125" width="330" height="180" rx="10" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle cx="855" cy="155" r="16" fill="#0f766e"/>
    <text x="850" y="161" font-family="sans-serif" font-size="14" font-weight="700" fill="#99f6e4">3</text>
    <text x="885" y="160" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Visual Builder (DAG)</text>

    <text x="840" y="195" font-family="sans-serif" font-size="12" fill="#94a3b8">• React Flow canvas drag &amp; drop</text>
    <text x="840" y="215" font-family="sans-serif" font-size="12" fill="#94a3b8">• Action nodes: open, click, fill, select, hover</text>
    <text x="840" y="235" font-family="sans-serif" font-size="12" fill="#94a3b8">• 13 Deterministic assertion rule nodes</text>
    <text x="840" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">• Dynamic variable injection &amp; data loops</text>
    <text x="840" y="275" font-family="sans-serif" font-size="12" fill="#94a3b8">• Circuit breaker, retries &amp; failure paths</text>

    <rect x="840" y="285" width="130" height="15" rx="3" fill="#1e293b"/>
    <text x="845" y="296" font-family="monospace" font-size="9" fill="#2dd4bf">POST /api/v1/flows</text>
  </g>

  <!-- Downward Arrow from Step 3 to Step 4 -->
  <path d="M 985 305 L 985 365 L 985 385" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- STEP 4: Async Dispatch & Celery Queue -->
  <g filter="url(#cardGlow)">
    <rect x="820" y="390" width="330" height="180" rx="10" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
    <circle cx="855" cy="420" r="16" fill="#be123c"/>
    <text x="850" y="426" font-family="sans-serif" font-size="14" font-weight="700" fill="#fecdd3">4</text>
    <text x="885" y="425" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Execution Queue (Celery)</text>

    <text x="840" y="460" font-family="sans-serif" font-size="12" fill="#94a3b8">• Trigger: Manual, Test Suite, API, or Beat</text>
    <text x="840" y="480" font-family="sans-serif" font-size="12" fill="#94a3b8">• Task dispatched to Redis 7 message broker</text>
    <text x="840" y="500" font-family="sans-serif" font-size="12" fill="#94a3b8">• Celery Worker picks up task DAG</text>
    <text x="840" y="520" font-family="sans-serif" font-size="12" fill="#94a3b8">• Session isolation initialized (--session)</text>
    <text x="840" y="540" font-family="sans-serif" font-size="12" fill="#94a3b8">• Secrets decrypted into memory only</text>

    <rect x="840" y="550" width="150" height="15" rx="3" fill="#1e293b"/>
    <text x="845" y="561" font-family="monospace" font-size="9" fill="#fb7185">POST /api/v1/executions/run</text>
  </g>

  <!-- Leftward Arrow 4 -> 5 -->
  <line x1="820" y1="480" x2="770" y2="480" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- STEP 5: Browser Subprocess Execution -->
  <g filter="url(#cardGlow)">
    <rect x="435" y="390" width="330" height="180" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="470" cy="420" r="16" fill="#047857"/>
    <text x="465" y="426" font-family="sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">5</text>
    <text x="500" y="425" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Subprocess Automation</text>

    <text x="455" y="460" font-family="sans-serif" font-size="12" fill="#94a3b8">• agent-browser CLI subprocess execution</text>
    <text x="455" y="480" font-family="sans-serif" font-size="12" fill="#94a3b8">• Native navigation &amp; domain whitelisting</text>
    <text x="455" y="500" font-family="sans-serif" font-size="12" fill="#94a3b8">• Sequential step execution &amp; validation</text>
    <text x="455" y="520" font-family="sans-serif" font-size="12" fill="#94a3b8">• Screenshots captured on step/failure</text>
    <text x="455" y="540" font-family="sans-serif" font-size="12" fill="#94a3b8">• Deterministic redaction of all logs/tokens</text>

    <rect x="455" y="550" width="160" height="15" rx="3" fill="#1e293b"/>
    <text x="460" y="561" font-family="monospace" font-size="9" fill="#34d399">agent-browser --session ...</text>
  </g>

  <!-- Leftward Arrow 5 -> 6 -->
  <line x1="435" y1="480" x2="385" y2="480" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#amberArrow)"/>

  <!-- STEP 6: Deterministic Self-Healing -->
  <g filter="url(#cardGlow)">
    <rect x="50" y="390" width="330" height="180" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="85" cy="420" r="16" fill="#78350f"/>
    <text x="80" y="426" font-family="sans-serif" font-size="14" font-weight="700" fill="#fde68a">6</text>
    <text x="115" y="425" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Deterministic Self-Healing</text>

    <text x="70" y="460" font-family="sans-serif" font-size="12" fill="#fbbf24">Triggered on Locator Failure (Timeout):</text>
    <text x="70" y="480" font-family="sans-serif" font-size="12" fill="#94a3b8">• Multi-factor fingerprint comparison</text>
    <text x="70" y="500" font-family="sans-serif" font-size="12" fill="#94a3b8">• Levenshtein text &amp; Jaccard ancestor score</text>
    <text x="70" y="520" font-family="sans-serif" font-size="12" fill="#34d399">• ≥95% score: Auto-Heal &amp; Continue</text>
    <text x="70" y="540" font-family="sans-serif" font-size="12" fill="#f59e0b">• 85-94% score: Pause &amp; Human Approval</text>

    <rect x="70" y="550" width="150" height="15" rx="3" fill="#1e293b"/>
    <text x="75" y="561" font-family="monospace" font-size="9" fill="#fde68a">POST /api/v1/healing/evaluate</text>
  </g>

  <!-- Downward Arrow from Step 6 to Step 7 -->
  <path d="M 215 570 L 215 625 L 215 645" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#emeraldArrow)"/>

  <!-- STEP 7: Observability & Real-Time Monitoring -->
  <g filter="url(#cardGlow)">
    <rect x="50" y="650" width="510" height="210" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="85" cy="680" r="16" fill="#0369a1"/>
    <text x="80" y="686" font-family="sans-serif" font-size="14" font-weight="700" fill="#bae6fd">7</text>
    <text x="115" y="685" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Execution Observability &amp; Live Logs</text>

    <text x="70" y="720" font-family="sans-serif" font-size="12" fill="#94a3b8">• Live Execution Dashboard with animated status badges</text>
    <text x="70" y="740" font-family="sans-serif" font-size="12" fill="#94a3b8">• Streaming console logs with auto-scroll and severity filtering</text>
    <text x="70" y="760" font-family="sans-serif" font-size="12" fill="#94a3b8">• Screenshots gallery with side-by-side step progression</text>
    <text x="70" y="780" font-family="sans-serif" font-size="12" fill="#94a3b8">• DOM Snapshot inspector with highlighted active nodes</text>
    <text x="70" y="800" font-family="sans-serif" font-size="12" fill="#94a3b8">• Performance metrics: step latency, duration, network calls</text>

    <rect x="70" y="815" width="220" height="20" rx="4" fill="#1e293b"/>
    <text x="80" y="829" font-family="monospace" font-size="10" fill="#38bdf8">GET /api/v1/executions/{id}/logs</text>
  </g>

  <!-- Rightward Arrow 7 -> 8 -->
  <line x1="560" y1="755" x2="630" y2="755" stroke="#10b981" stroke-width="2.5" marker-end="url(#emeraldArrow)"/>

  <!-- STEP 8: Tamper-Evident Reporting & Compliance -->
  <g filter="url(#cardGlow)">
    <rect x="640" y="650" width="510" height="210" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="675" cy="680" r="16" fill="#047857"/>
    <text x="670" y="686" font-family="sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">8</text>
    <text x="705" y="685" font-family="sans-serif" font-size="16" font-weight="700" fill="#e2e8f0">Tamper-Proof Audit &amp; Artifact Reports</text>

    <text x="660" y="720" font-family="sans-serif" font-size="12" fill="#94a3b8">• Cryptographic SHA-256 hash checksums on all artifacts</text>
    <text x="660" y="740" font-family="sans-serif" font-size="12" fill="#94a3b8">• Full HAR network traffic archive for root-cause analysis</text>
    <text x="660" y="760" font-family="sans-serif" font-size="12" fill="#94a3b8">• Comprehensive HTML &amp; PDF test execution audit reports</text>
    <text x="660" y="780" font-family="sans-serif" font-size="12" fill="#94a3b8">• Immutable PostgreSQL execution history with version pins</text>
    <text x="660" y="800" font-family="sans-serif" font-size="12" fill="#94a3b8">• Zero-AI compliance signoff for enterprise security auditing</text>

    <rect x="660" y="815" width="220" height="20" rx="4" fill="#1e293b"/>
    <text x="670" y="829" font-family="monospace" font-size="10" fill="#10b981">GET /api/v1/reports/{id}/export</text>
  </g>
</svg>
