<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <filter id="hGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <marker id="mArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="mAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="mRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#bgH)"/>

  <!-- Header -->
  <rect x="40" y="25" width="1120" height="65" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#hGlow)"/>
  <text x="70" y="62" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Multi-Factor Deterministic Self-Healing Architecture</text>
  <rect x="880" y="42" width="260" height="30" rx="15" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="900" y="62" font-family="sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">MATHEMATICALLY PROVEN / ZERO AI</text>

  <!-- Step 1: Selector Failure Event -->
  <g transform="translate(40, 115)" filter="url(#hGlow)">
    <rect width="320" height="120" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="320" height="26" rx="8" fill="#7f1d1d"/>
    <rect y="18" width="320" height="8" fill="#7f1d1d"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#fecaca">LOCATOR FAILURE DETECTED</text>
    <text x="12" y="48" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Timeout (NoSuchElementException)</text>
    <text x="12" y="68" font-family="monospace" font-size="10" fill="#f87171">Failed: button.btn-checkout-primary</text>
    <text x="12" y="86" font-family="sans-serif" font-size="10" fill="#94a3b8">Trigger self-healing evaluation hook</text>
    <text x="12" y="104" font-family="monospace" font-size="9" fill="#64748b">action_type = "click"</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="360" y1="175" x2="430" y2="175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#mArrow)"/>

  <!-- Step 2: Fresh Accessibility Tree Capture -->
  <g transform="translate(440, 115)" filter="url(#hGlow)">
    <rect width="320" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="320" height="26" rx="8" fill="#0369a1"/>
    <rect y="18" width="320" height="8" fill="#0369a1"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#e0f2fe">LIVE ACCESSIBILITY EXTRACTION</text>
    <text x="12" y="48" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">agent-browser snapshot -i --json</text>
    <text x="12" y="68" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Extract current interactive element tree</text>
    <text x="12" y="86" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Map DOM candidates: @e1, @e2, @e3...</text>
    <text x="12" y="104" font-family="sans-serif" font-size="10" fill="#94a3b8">Load original profile fingerprint from DB</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="760" y1="175" x2="830" y2="175" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#mArrow)"/>

  <!-- Step 3: Candidate Filtering -->
  <g transform="translate(840, 115)" filter="url(#hGlow)">
    <rect width="320" height="120" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="320" height="26" rx="8" fill="#581c87"/>
    <rect y="18" width="320" height="8" fill="#581c87"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#f3e8ff">CANDIDATE PRUNING &amp; MATCHING</text>
    <text x="12" y="48" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Tag, Role &amp; Hierarchy Filter</text>
    <text x="12" y="68" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Tag compatibility: &lt;button&gt; vs &lt;a&gt;</text>
    <text x="12" y="86" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Eliminate invisible / detached nodes</text>
    <text x="12" y="104" font-family="sans-serif" font-size="10" fill="#34d399">N = 8 candidate elements evaluated</text>
  </g>

  <!-- Downward Arrow to Scoring Engine -->
  <path d="M 1000 235 L 1000 270 L 600 270 L 600 295" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#mArrow)"/>

  <!-- Core Multi-Factor Scoring Engine -->
  <g transform="translate(40, 305)" filter="url(#hGlow)">
    <rect width="1120" height="195" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <rect width="1120" height="34" rx="10" fill="#1e3a8a"/>
    <rect y="24" width="1120" height="10" fill="#1e3a8a"/>
    <text x="20" y="23" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">DETERMINISTIC MULTI-FACTOR WEIGHTED CONFIDENCE SCORING FORMULA</text>

    <!-- Formula Box -->
    <g transform="translate(20, 50)" font-family="sans-serif">
      <rect width="1080" height="130" rx="6" fill="#1e293b"/>
      
      <!-- Factor 1 -->
      <rect x="20" y="15" width="195" height="100" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="30" y="38" font-size="13" font-weight="800" fill="#60a5fa">Attribute Stability</text>
      <text x="30" y="60" font-size="20" font-weight="900" fill="#ffffff">35%</text>
      <text x="30" y="82" font-size="10" fill="#cbd5e1">Exact id, name, testid,</text>
      <text x="30" y="98" font-size="10" fill="#94a3b8">data-cy, type matching</text>

      <!-- Factor 2 -->
      <rect x="235" y="15" width="195" height="100" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="245" y="38" font-size="13" font-weight="800" fill="#c084fc">ARIA Semantics</text>
      <text x="245" y="60" font-size="20" font-weight="900" fill="#ffffff">25%</text>
      <text x="245" y="82" font-size="10" fill="#cbd5e1">ARIA role, accessible</text>
      <text x="245" y="98" font-size="10" fill="#94a3b8">name, aria-label match</text>

      <!-- Factor 3 -->
      <rect x="450" y="15" width="195" height="100" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="460" y="38" font-size="13" font-weight="800" fill="#34d399">DOM Hierarchy</text>
      <text x="460" y="60" font-size="20" font-weight="900" fill="#ffffff">20%</text>
      <text x="460" y="82" font-size="10" fill="#cbd5e1">Jaccard ancestor set</text>
      <text x="460" y="98" font-size="10" fill="#94a3b8">intersection similarity</text>

      <!-- Factor 4 -->
      <rect x="665" y="15" width="195" height="100" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="675" y="38" font-size="13" font-weight="800" fill="#fbbf24">Geometry &amp; Flow</text>
      <text x="675" y="60" font-size="20" font-weight="900" fill="#ffffff">15%</text>
      <text x="675" y="82" font-size="10" fill="#cbd5e1">Relative bounding box,</text>
      <text x="675" y="98" font-size="10" fill="#94a3b8">sibling element order</text>

      <!-- Factor 5 -->
      <rect x="880" y="15" width="180" height="100" rx="4" fill="#0f172a" stroke="#ec4899" stroke-width="1"/>
      <text x="890" y="38" font-size="13" font-weight="800" fill="#f472b6">String Distance</text>
      <text x="890" y="60" font-size="20" font-weight="900" fill="#ffffff">5%</text>
      <text x="890" y="82" font-size="10" fill="#cbd5e1">Levenshtein edit-ratio</text>
      <text x="890" y="98" font-size="10" fill="#94a3b8">(RapidFuzz normalized)</text>
    </g>
  </g>

  <!-- Downward Connectors from Engine to 3 Decision Tiers -->
  <line x1="200" y1="500" x2="200" y2="540" stroke="#10b981" stroke-width="2.5" marker-end="url(#mGreen)"/>
  <line x1="600" y1="500" x2="600" y2="540" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#mAmber)"/>
  <line x1="1000" y1="500" x2="1000" y2="540" stroke="#ef4444" stroke-width="2.5" marker-end="url(#mRed)"/>

  <!-- Tier 1: Confidence >= 95% -->
  <g transform="translate(40, 545)" filter="url(#hGlow)">
    <rect width="350" height="225" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect width="350" height="30" rx="8" fill="#065f46"/>
    <rect y="22" width="350" height="8" fill="#065f46"/>
    <text x="15" y="21" font-family="sans-serif" font-size="12" font-weight="800" fill="#a7f3d0">TIER 1: AUTO-HEAL (CONFIDENCE ≥ 95%)</text>

    <g transform="translate(15, 45)" font-family="sans-serif" font-size="11">
      <text x="0" y="15" font-weight="700" fill="#34d399">Autonomous Resolution — No Interruption</text>
      <text x="0" y="38" fill="#cbd5e1">• Primary locator replaced with candidate</text>
      <text x="0" y="58" fill="#cbd5e1">• Action executed immediately on browser</text>
      <text x="0" y="78" fill="#cbd5e1">• Shift logged to `healing_events` table</text>
      <text x="0" y="98" fill="#cbd5e1">• DOM diff captured for historical trace</text>
      <text x="0" y="118" fill="#cbd5e1">• Status tagged: "HEALED (AUTONOMOUS)"</text>

      <rect y="135" width="320" height="32" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="155" font-family="monospace" font-size="10" fill="#a7f3d0">Score: 97.4% → Swapped to @e4</text>
    </g>
  </g>

  <!-- Tier 2: Confidence 85% - 94% -->
  <g transform="translate(425, 545)" filter="url(#hGlow)">
    <rect width="350" height="225" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <rect width="350" height="30" rx="8" fill="#78350f"/>
    <rect y="22" width="350" height="8" fill="#78350f"/>
    <text x="15" y="21" font-family="sans-serif" font-size="12" font-weight="800" fill="#fde68a">TIER 2: APPROVAL GATE (85% – 94%)</text>

    <g transform="translate(15, 45)" font-family="sans-serif" font-size="11">
      <text x="0" y="15" font-weight="700" fill="#fbbf24">Human-in-the-Loop Verification Gate</text>
      <text x="0" y="38" fill="#cbd5e1">• Flow execution paused safely</text>
      <text x="0" y="58" fill="#cbd5e1">• Approval card created for QA / Owner</text>
      <text x="0" y="78" fill="#cbd5e1">• Side-by-side screenshot &amp; DOM comparison</text>
      <text x="0" y="98" fill="#cbd5e1">• If Approved: Resume &amp; commit new locator</text>
      <text x="0" y="118" fill="#cbd5e1">• If Rejected: Terminate test gracefully</text>

      <rect y="135" width="320" height="32" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="155" font-family="monospace" font-size="10" fill="#fde68a">Score: 89.1% → Waiting for QA Lead</text>
    </g>
  </g>

  <!-- Tier 3: Hard Fail & Destructive Safety -->
  <g transform="translate(810, 545)" filter="url(#hGlow)">
    <rect width="350" height="225" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <rect width="350" height="30" rx="8" fill="#7f1d1d"/>
    <rect y="22" width="350" height="8" fill="#7f1d1d"/>
    <text x="15" y="21" font-family="sans-serif" font-size="12" font-weight="800" fill="#fecaca">TIER 3: HARD FAIL / DESTRUCTIVE GATE</text>

    <g transform="translate(15, 45)" font-family="sans-serif" font-size="11">
      <text x="0" y="15" font-weight="700" fill="#f87171">Strict Safety Enforcement</text>
      <text x="0" y="38" fill="#cbd5e1">• If Confidence &lt; 85%: Zero guessing</text>
      <text x="0" y="58" fill="#cbd5e1">• Abort step immediately (Fail Test)</text>
      <text x="0" y="78" fill="#cbd5e1">• Destructive Action Gate: Deletions/Drops</text>
      <text x="0" y="98" fill="#fca5a5">  require ≥98% score + explicit token</text>
      <text x="0" y="118" fill="#cbd5e1">• Prevents accidental deletion of live data</text>

      <rect y="135" width="320" height="32" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="155" font-family="monospace" font-size="10" fill="#f87171">Safety Abort: Prevent False Positive</text>
    </g>
  </g>
</svg>
