<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="edgeArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="successArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="failArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="#090d16"/>
  
  <!-- Canvas Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="650" x2="1200" y2="650"/>
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <!-- Vertical -->
    <line x1="260" y1="0" x2="260" y2="750"/>
    <line x1="320" y1="0" x2="320" y2="750"/>
    <line x1="380" y1="0" x2="380" y2="750"/>
    <line x1="440" y1="0" x2="440" y2="750"/>
    <line x1="500" y1="0" x2="500" y2="750"/>
    <line x1="560" y1="0" x2="560" y2="750"/>
    <line x1="620" y1="0" x2="620" y2="750"/>
    <line x1="680" y1="0" x2="680" y2="750"/>
    <line x1="740" y1="0" x2="740" y2="750"/>
    <line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="860" y1="0" x2="860" y2="750"/>
  </g>

  <!-- Top Toolbar -->
  <rect x="0" y="0" width="1200" height="54" fill="#0f172a" stroke-bottom="#334155"/>
  <line x1="0" y1="54" x2="1200" y2="54" stroke="#334155" stroke-width="1"/>

  <text x="20" y="33" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Visual Flow Builder</text>
  <rect x="180" y="16" width="140" height="24" rx="4" fill="#1e293b"/>
  <text x="190" y="32" font-family="sans-serif" font-size="11" fill="#94a3b8">Flow: <tspan fill="#38bdf8" font-weight="700">Login &amp; Auth v2.1</tspan></text>

  <!-- Toolbar action buttons -->
  <rect x="740" y="12" width="110" height="30" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="755" y="31" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Validate DAG</text>

  <rect x="865" y="12" width="110" height="30" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="880" y="31" font-family="sans-serif" font-size="12" font-weight="600" fill="#60a5fa">Save Version</text>

  <rect x="990" y="12" width="130" height="30" rx="5" fill="#2563eb"/>
  <text x="1010" y="31" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">▶ Run Execution</text>

  <!-- Left Sidebar: Node Palette -->
  <rect x="0" y="54" width="220" height="696" fill="#0f172a"/>
  <line x1="220" y1="54" x2="220" y2="750" stroke="#334155" stroke-width="1"/>
  <text x="16" y="82" font-family="sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1">ACTION NODES</text>

  <!-- Palette Node Items -->
  <g font-family="sans-serif" font-size="12">
    <!-- Navigate -->
    <rect x="12" y="96" width="196" height="36" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="28" cy="114" r="5" fill="#38bdf8"/>
    <text x="44" y="119" font-weight="600" fill="#f8fafc">Navigate (Open URL)</text>

    <!-- Click -->
    <rect x="12" y="140" width="196" height="36" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <circle cx="28" cy="158" r="5" fill="#a855f7"/>
    <text x="44" y="163" font-weight="600" fill="#f8fafc">Click Element</text>

    <!-- Fill -->
    <rect x="12" y="184" width="196" height="36" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <circle cx="28" cy="202" r="5" fill="#10b981"/>
    <text x="44" y="207" font-weight="600" fill="#f8fafc">Fill Input / Type</text>

    <!-- Select / Dropdown -->
    <rect x="12" y="228" width="196" height="36" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="28" cy="246" r="5" fill="#f59e0b"/>
    <text x="44" y="251" font-weight="600" fill="#f8fafc">Select Option</text>

    <!-- Wait / Sleep -->
    <rect x="12" y="272" width="196" height="36" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <circle cx="28" cy="290" r="5" fill="#64748b"/>
    <text x="44" y="295" font-weight="600" fill="#f8fafc">Wait / Delay (ms)</text>

    <!-- Screenshot -->
    <rect x="12" y="316" width="196" height="36" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
    <circle cx="28" cy="334" r="5" fill="#ec4899"/>
    <text x="44" y="339" font-weight="600" fill="#f8fafc">Capture Screenshot</text>

    <text x="16" y="380" font-family="sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1">CONTROL FLOW</text>

    <!-- Condition Branch -->
    <rect x="12" y="395" width="196" height="36" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1"/>
    <circle cx="28" cy="413" r="5" fill="#eab308"/>
    <text x="44" y="418" font-weight="600" fill="#f8fafc">If / Condition Branch</text>

    <!-- Loop -->
    <rect x="12" y="439" width="196" height="36" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="28" cy="457" r="5" fill="#06b6d4"/>
    <text x="44" y="462" font-weight="600" fill="#f8fafc">For Each / Data Loop</text>

    <!-- Assertion -->
    <rect x="12" y="483" width="196" height="36" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <circle cx="28" cy="501" r="5" fill="#22c55e"/>
    <text x="44" y="506" font-weight="600" fill="#f8fafc">Deterministic Assert</text>
  </g>

  <!-- Canvas DAG Connecting Edges -->
  <!-- Edge 1: Start -> Navigate -->
  <path d="M 330 160 L 330 200" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#edgeArrow)"/>
  <!-- Edge 2: Navigate -> Fill Email -->
  <path d="M 330 290 L 330 330" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#edgeArrow)"/>
  <!-- Edge 3: Fill Email -> Fill Password -->
  <path d="M 440 375 L 500 375" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#edgeArrow)"/>
  <!-- Edge 4: Fill Password -> Click Submit -->
  <path d="M 610 420 L 610 460" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#edgeArrow)"/>
  <!-- Edge 5: Click Submit -> Condition Check -->
  <path d="M 610 550 L 610 590" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#edgeArrow)"/>
  <!-- Edge 6: Condition True -> Verify Element -->
  <path d="M 720 635 L 780 635" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#successArrow)"/>

  <!-- Canvas Node 1: Start Trigger -->
  <g transform="translate(250, 90)" filter="url(#nodeShadow)">
    <rect width="160" height="70" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect width="160" height="24" rx="8" fill="#334155"/>
    <rect y="16" width="160" height="8" fill="#334155"/>
    <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">START TRIGGER</text>
    <text x="12" y="44" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Manual / CI Dispatch</text>
    <text x="12" y="60" font-family="monospace" font-size="10" fill="#38bdf8">session_id = uuid()</text>
    <circle cx="80" cy="70" r="5" fill="#38bdf8"/>
  </g>

  <!-- Canvas Node 2: Open URL -->
  <g transform="translate(230, 205)" filter="url(#nodeShadow)">
    <rect width="200" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="200" height="26" rx="8" fill="#0284c7"/>
    <rect y="18" width="200" height="8" fill="#0284c7"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">ACTION: NAVIGATE</text>
    <text x="12" y="46" font-family="sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Target URL:</text>
    <text x="12" y="62" font-family="monospace" font-size="10" fill="#93c5fd">https://enterprise.app/login</text>
    <text x="12" y="78" font-family="sans-serif" font-size="10" fill="#94a3b8">Timeout: 30000ms • Wait: domcontent</text>
    <circle cx="100" cy="85" r="5" fill="#38bdf8"/>
  </g>

  <!-- Canvas Node 3: Fill Email Input -->
  <g transform="translate(230, 335)" filter="url(#nodeShadow)">
    <rect width="210" height="90" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="26" rx="8" fill="#059669"/>
    <rect y="18" width="210" height="8" fill="#059669"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">ACTION: FILL INPUT</text>
    <text x="12" y="46" font-family="monospace" font-size="10" fill="#6ee7b7">input[type="email"]</text>
    <text x="12" y="62" font-family="sans-serif" font-size="11" fill="#cbd5e1">Value: <tspan fill="#34d399 font-weight=700">user@company.com</tspan></text>
    <text x="12" y="78" font-family="sans-serif" font-size="10" fill="#94a3b8">Fallback: [data-testid="email"]</text>
    <circle cx="210" cy="45" r="5" fill="#38bdf8"/>
  </g>

  <!-- Canvas Node 4: Fill Password Input -->
  <g transform="translate(505, 335)" filter="url(#nodeShadow)">
    <rect width="210" height="90" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="26" rx="8" fill="#059669"/>
    <rect y="18" width="210" height="8" fill="#059669"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">ACTION: FILL SECRET</text>
    <text x="12" y="46" font-family="monospace" font-size="10" fill="#6ee7b7">input[type="password"]</text>
    <text x="12" y="62" font-family="sans-serif" font-size="11" fill="#cbd5e1">Secret: <tspan fill="#f59e0b">{{CREDS.AUTH_PASS}}</tspan></text>
    <text x="12" y="78" font-family="sans-serif" font-size="10" fill="#34d399">In-Memory Redacted Pipe</text>
    <circle cx="105" cy="90" r="5" fill="#38bdf8"/>
  </g>

  <!-- Canvas Node 5: Click Submit Button -->
  <g transform="translate(505, 465)" filter="url(#nodeShadow)">
    <rect width="210" height="85" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <rect width="210" height="26" rx="8" fill="#7c3aed"/>
    <rect y="18" width="210" height="8" fill="#7c3aed"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">ACTION: CLICK BUTTON</text>
    <text x="12" y="46" font-family="monospace" font-size="10" fill="#c084fc">button[type="submit"]</text>
    <text x="12" y="62" font-family="sans-serif" font-size="11" fill="#cbd5e1">Self-Healing: <tspan fill="#34d399">ENABLED (≥95%)</tspan></text>
    <text x="12" y="76" font-family="sans-serif" font-size="10" fill="#94a3b8">Post-action: wait for navigation</text>
    <circle cx="105" cy="85" r="5" fill="#38bdf8"/>
  </g>

  <!-- Canvas Node 6: Branch / Check Status -->
  <g transform="translate(505, 595)" filter="url(#nodeShadow)">
    <rect width="210" height="85" rx="8" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
    <rect width="210" height="26" rx="8" fill="#ca8a04"/>
    <rect y="18" width="210" height="8" fill="#ca8a04"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">CONDITION BRANCH</text>
    <text x="12" y="46" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">If URL contains "/dashboard"</text>
    <text x="12" y="64" font-family="sans-serif" font-size="10" fill="#34d399">✔ True: Proceed to Dashboard steps</text>
    <text x="12" y="78" font-family="sans-serif" font-size="10" fill="#ef4444">✘ False: Trigger failure handler</text>
    <circle cx="210" cy="42" r="5" fill="#10b981"/>
  </g>

  <!-- Canvas Node 7: Assertion Node -->
  <g transform="translate(785, 595)" filter="url(#nodeShadow)">
    <rect width="210" height="85" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <rect width="210" height="26" rx="8" fill="#15803d"/>
    <rect y="18" width="210" height="8" fill="#15803d"/>
    <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">ASSERT: ELEMENT VISIBLE</text>
    <text x="12" y="46" font-family="monospace" font-size="10" fill="#86efac">div[data-testid="user-avatar"]</text>
    <text x="12" y="62" font-family="sans-serif" font-size="11" fill="#cbd5e1">Assertion: <tspan fill="#4ade80">is_visible == True</tspan></text>
    <text x="12" y="78" font-family="sans-serif" font-size="10" fill="#94a3b8">Artifact: Capture Screenshot</text>
  </g>

  <!-- Right Sidebar: Node Property Inspector -->
  <rect x="940" y="54" width="260" height="696" fill="#0f172a"/>
  <line x1="940" y1="54" x2="940" y2="750" stroke="#334155" stroke-width="1"/>
  
  <text x="955" y="82" font-family="sans-serif" font-size="12" font-weight="800" fill="#f8fafc">STEP CONFIGURATION</text>
  <text x="955" y="98" font-family="sans-serif" font-size="10" fill="#94a3b8">Selected: Step #4 (Click Button)</text>

  <!-- Inspector Fields -->
  <g transform="translate(955, 115)" font-family="sans-serif" font-size="11">
    <text x="0" y="12" font-weight="700" fill="#cbd5e1">Step ID:</text>
    <rect x="0" y="18" width="230" height="26" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="8" y="35" font-family="monospace" font-size="10" fill="#94a3b8">step_click_login_submit</text>

    <text x="0" y="62" font-weight="700" fill="#cbd5e1">Primary CSS / XPath Selector:</text>
    <rect x="0" y="68" width="230" height="26" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="8" y="85" font-family="monospace" font-size="10" fill="#60a5fa">button[type="submit"]</text>

    <text x="0" y="112" font-weight="700" fill="#cbd5e1">Deterministic Self-Healing:</text>
    <rect x="0" y="118" width="230" height="28" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="8" y="136" font-weight="700" fill="#a7f3d0">ENABLED (Threshold: 95%)</text>

    <text x="0" y="165" font-weight="700" fill="#cbd5e1">Action Timeout (ms):</text>
    <rect x="0" y="171" width="230" height="26" rx="4" fill="#1e293b"/>
    <text x="8" y="188" font-family="monospace" font-size="10" fill="#f8fafc">10000</text>

    <text x="0" y="215" font-weight="700" fill="#cbd5e1">Retry Strategy:</text>
    <rect x="0" y="221" width="230" height="26" rx="4" fill="#1e293b"/>
    <text x="8" y="238" font-size="10" fill="#f8fafc">Max 3 retries (exp backoff)</text>

    <text x="0" y="265" font-weight="700" fill="#cbd5e1">Take Screenshot:</text>
    <rect x="0" y="271" width="230" height="26" rx="4" fill="#1e293b"/>
    <text x="8" y="288" font-size="10" fill="#f8fafc">On Failure + On Success</text>

    <text x="0" y="315" font-weight="700" fill="#cbd5e1">Circuit Breaker Trip:</text>
    <rect x="0" y="321" width="230" height="26" rx="4" fill="#1e293b"/>
    <text x="8" y="338" font-size="10" fill="#f8fafc">Trip after 2 consecutive fails</text>
  </g>
</svg>
