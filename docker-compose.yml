version: "3.8"

# ==============================================================================
# AutomationTestingWithAgentBrowser - Multi-User SaaS Platform
# Strict Zero-AI / No-LLM Company Data Protection Architecture
# ==============================================================================

services:
  # 1. PostgreSQL Relational Database (19 enterprise tables)
  postgres:
    image: postgres:16-alpine
    container_name: automation_testing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-automation_platform_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-automation_platform_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & State Store
  redis:
    image: redis:7-alpine
    container_name: automation_testing_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI REST Backend Server
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: automation_testing_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automation_platform_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-enterprise-production-jwt-secret-key-32chars}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-${CREDENTIALS_MASTER_KEY:-enterprise-master-encryption-key-32chars}}
      AGENT_BROWSER_CLI: agent-browser
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
      AGENT_BROWSER_ARGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
      STORAGE_DIR: /app/reports
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      ZERO_AI_POLICY_ENFORCED: "true"
      AUTOMATION_ENGINE: ${AUTOMATION_ENGINE:-playwright}
      AUTOMATION_SERVICE_URL: http://automation_api:3001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-enterprise-internal-secret-service-key-32chars}
    ports:
      - "8000:8000"
    volumes:
      - reports_storage:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # 4. Celery Background Worker (Asynchronous agent-browser subprocess isolation)
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: automation_testing_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automation_platform_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-enterprise-production-jwt-secret-key-32chars}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-${CREDENTIALS_MASTER_KEY:-enterprise-master-encryption-key-32chars}}
      AGENT_BROWSER_CLI: agent-browser
      AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
      AGENT_BROWSER_ARGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
      STORAGE_DIR: /app/reports
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      ZERO_AI_POLICY_ENFORCED: "true"
      AUTOMATION_ENGINE: ${AUTOMATION_ENGINE:-playwright}
      AUTOMATION_SERVICE_URL: http://automation_api:3001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-enterprise-internal-secret-service-key-32chars}
    volumes:
      - reports_storage:/app/reports
    command: ["celery", "-A", "backend.app.worker.celery_app", "worker", "-l", "INFO", "-c", "4"]

  # 5. Celery Beat Scheduler (Periodic cron evaluations & retention cleanup)
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: automation_testing_beat
    restart: unless-stopped
    depends_on:
      celery_worker:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automation_platform_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      STORAGE_DIR: /app/reports
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Kolkata}
      ZERO_AI_POLICY_ENFORCED: "true"
      AUTOMATION_ENGINE: ${AUTOMATION_ENGINE:-playwright}
      AUTOMATION_SERVICE_URL: http://automation_api:3001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-enterprise-internal-secret-service-key-32chars}
    volumes:
      - reports_storage:/app/reports
    command: ["celery", "-A", "backend.app.worker.celery_app", "beat", "-l", "INFO"]

  # 6. NestJS Playwright Automation API Service
  automation_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.automation
    container_name: automation_testing_nestjs_api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      AUTOMATION_SERVICE_PORT: 3001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-enterprise-internal-secret-service-key-32chars}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DIR: /app/reports
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automation_platform_db}
    ports:
      - "3001:3001"
    volumes:
      - reports_storage:/app/reports
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 7. NestJS Playwright Dedicated Browser Worker (BullMQ Consumer)
  automation_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.automation
    container_name: automation_testing_playwright_worker
    restart: unless-stopped
    shm_size: "2gb"
    depends_on:
      automation_api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-enterprise-internal-secret-service-key-32chars}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DIR: /app/reports
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-automation_platform_db}
      WORKER_CONCURRENCY: 4
    volumes:
      - reports_storage:/app/reports

  # 8. Next.js Enterprise SaaS Frontend UI
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: automation_testing_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  reports_storage:
