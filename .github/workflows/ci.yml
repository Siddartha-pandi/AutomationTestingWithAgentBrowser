name: Enterprise CI/CD & Verification Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  zero-ai-compliance:
    name: Zero-AI Policy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Strict Zero-AI Policy
        run: python scripts/verify_zero_ai_policy.py

  frontend-pipeline:
    name: Next.js Frontend Pipeline (Typecheck & Build)
    runs-on: ubuntu-latest
    needs: zero-ai-compliance
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Type Check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build Next.js Application
        working-directory: ./frontend
        run: npm run build

  backend-pipeline:
    name: Python FastAPI Backend Pipeline
    runs-on: ubuntu-latest
    needs: zero-ai-compliance
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automation_platform_db
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          JWT_SECRET: test-ci-secret-for-jwt-tokens-32chars
          APP_ENCRYPTION_KEY: test-ci-aes-256-encryption-key-for-secrets
          ENVIRONMENT: test
        run: |
          python -m pytest tests -v

  automation-service-pipeline:
    name: NestJS Playwright Automation Pipeline
    runs-on: ubuntu-latest
    needs: zero-ai-compliance
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        working-directory: ./automation-service
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./automation-service
        run: npx playwright install --with-deps chromium

      - name: Run Jest Unit and Integration Tests
        working-directory: ./automation-service
        run: npm test

      - name: Build NestJS Service
        working-directory: ./automation-service
        run: npm run build

  docker-pipeline:
    name: Docker Container Builds & Health Checks
    runs-on: ubuntu-latest
    needs: [frontend-pipeline, backend-pipeline, automation-service-pipeline]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: false
          tags: automation-backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.frontend
          push: false
          tags: automation-frontend:test

      - name: Build Automation Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.automation
          push: false
          tags: automation-service:test
