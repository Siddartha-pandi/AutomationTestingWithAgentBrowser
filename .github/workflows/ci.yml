name: CI / Production Verification

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  zero-ai-compliance:
    name: Zero-AI Policy Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Strict Zero-AI Policy
        run: python scripts/verify_zero_ai_policy.py

  backend-tests:
    name: Backend Test Suite & Health
    runs-on: ubuntu-latest
    needs: zero-ai-compliance
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser

      - name: Set up Node.js for agent-browser CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install agent-browser CLI
        run: |
          npm install -g agent-browser@0.41.2
          agent-browser --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Regression Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automation_platform_db
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          JWT_SECRET: test-ci-secret-for-jwt-tokens-32chars
          APP_ENCRYPTION_KEY: test-ci-aes-256-encryption-key-for-secrets
          AGENT_BROWSER_CLI: agent-browser
          AGENT_BROWSER_ARGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
        run: |
          python -m pytest tests/test_phase1_stabilization.py \
                           tests/test_phase2_engine.py \
                           tests/test_phase4_monitoring_reporting.py \
                           tests/test_phase5_multiuser_enterprise.py \
                           tests/test_phase6_production_readiness.py \
                           -v

  docker-build:
    name: Docker Container Builds
    runs-on: ubuntu-latest
    needs: zero-ai-compliance
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: automation-testing-backend:latest

